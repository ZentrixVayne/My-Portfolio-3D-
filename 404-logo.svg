<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F5A0"/>
      <stop offset="1" stop-color="#00D9F5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Stick figure (jumping pose) -->
  <g transform="translate(600, 250)" fill="#0A1929">
    <circle cx="0" cy="-30" r="22"/>
    <path d="M0 -8 L0 70" stroke="#0A1929" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M0 15 L-35 -20" stroke="#0A1929" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M0 15 L35 -20" stroke="#0A1929" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M0 70 L-25 115" stroke="#0A1929" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M0 70 L25 115" stroke="#0A1929" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Scattered circles -->
  <circle cx="200" cy="150" r="8" fill="#0A1929" opacity="0.6"/>
  <circle cx="1050" cy="200" r="12" fill="#0A1929" opacity="0.5"/>
  <circle cx="150" cy="450" r="6" fill="#0A1929" opacity="0.4"/>
  <circle cx="1000" cy="480" r="10" fill="#0A1929" opacity="0.5"/>
  <circle cx="950" cy="120" r="5" fill="#0A1929" opacity="0.3"/>
  <circle cx="280" cy="380" r="7" fill="#0A1929" opacity="0.4"/>
  <!-- 404 text -->
  <text x="600" y="520" font-family="'Space Grotesk',sans-serif" font-size="80" font-weight="700" fill="#0A1929" text-anchor="middle" letter-spacing="-3">404</text>
  <text x="600" y="565" font-family="'JetBrains Mono',monospace" font-size="16" letter-spacing="8" fill="#0A1929" text-anchor="middle" opacity="0.6">PAGE NOT FOUND</text>
