<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Cache Busting Tags to force Vercel and Browsers to update -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- Sets your logo.png as the browser tab icon -->
  <link rel="icon" type="image/png" href="/logo.png" />
  
  <title>Arshman Anil -- Full-Stack Developer</title>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- ES Module Shims (Polyfill to guarantee importmaps work on all browsers/servers) -->
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.0/dist/es-module-shims.js"></script>

  <!-- Suppress Tailwind & Babel console warnings -->
  <script>
    (function() {
      const origWarn = window.console.warn;
      window.console.warn = function(...args) {
        if (typeof args[0] === 'string' && (args[0].includes('cdn.tailwindcss.com') || args[0].includes('in-browser Babel') || args[0].includes('es-module-shims'))) {
          return;
        }
        origWarn(...args);
      };
    })();
  </script>

  <!-- Google Fonts (Kanit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kanit: ['Kanit', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Babel to compile TSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React 18, Framer Motion, Lucide Icons via ES Modules (importmap) -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
        "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
    }
    html, body, #root {
      background-color: #0C0C0C;
      font-family: 'Kanit', sans-serif;
      color: #D7E2EA;
      width: 100%;
      overflow-x: clip;
    }
    .hero-heading {
      background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .project-card-wrapper {
      position: sticky;
      top: calc(6rem + var(--card-offset, 0px));
    }
    @media (min-width: 768px) {
      .project-card-wrapper {
        top: calc(8rem + var(--card-offset, 0px));
      }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0c0c0c; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    /* ================================================================
       CUSTOM CURSOR STYLES
    ================================================================= */
    @media (pointer: fine) {
      * { cursor: none !important; }
      input, textarea { cursor: text !important; }
      .cursor-dot {
        position: fixed; top: 0; left: 0; width: 8px; height: 8px;
        background-color: #39bda7; border-radius: 50%;
        transform: translate(-50%, -50%); z-index: 9999; pointer-events: none;
        transition: opacity 0.2s;
      }
      .cursor-outline {
        position: fixed; top: 0; left: 0; width: 40px; height: 40px;
        border: 2px solid rgba(57, 189, 167, 0.5); border-radius: 50%;
        transform: translate(-50%, -50%); z-index: 9998; pointer-events: none;
        transition: width 0.2s, height 0.2s, border-color 0.2s, background-color 0.2s;
      }
      .cursor-outline.cursor-hover {
        width: 60px; height: 60px; background-color: rgba(57, 189, 167, 0.1); border-color: transparent;
      }
    }

    /* ================================================================
       CUSTOM CONTACT BUTTON (From Uiverse.io)
    ================================================================= */
    .custom-contact-btn {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #4f4f4f;
      border-radius: 4px;
      transition: all 0.2s ease-in;
      position: relative;
      overflow: hidden;
      font-size: 19px;
      cursor: pointer;
      color: #D7E2EA;
      z-index: 1;
      background: transparent;
      font-family: 'Kanit', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      isolation: isolate;
    }

    .custom-contact-btn:before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%) scaleY(1) scaleX(1.25);
      top: 100%;
      width: 140%;
      height: 180%;
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 50%;
      display: block;
      transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
      z-index: -1;
    }

    .custom-contact-btn:after {
      content: "";
      position: absolute;
      left: 55%;
      transform: translateX(-50%) scaleY(1) scaleX(1.45);
      top: 180%;
      width: 160%;
      height: 190%;
      background-color: #39bda7;
      border-radius: 50%;
      display: block;
      transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
      z-index: -1;
    }

    .custom-contact-btn:hover {
      color: #ffffff;
      border: 1px solid #39bda7;
    }

    .custom-contact-btn:hover:before {
      top: -35%;
      background-color: #39bda7;
      transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
    }

    .custom-contact-btn:hover:after {
      top: -45%;
      background-color: #39bda7;
      transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
    }

    /* ================================================================
       LOADING SCREEN ANIMATION (Fixed & Perfectly Centered)
    ================================================================= */
    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      --color: #D7E2EA; 
      --animation: 2s ease-in-out infinite;
    }

    .loader .circle {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 20px;
      height: 20px;
      border: solid 2px var(--color);
      border-radius: 50%;
      margin: 0 10px;
      background-color: transparent;
      animation: circle-keys var(--animation);
      box-sizing: content-box;
    }

    .loader .circle .dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background-color: var(--color);
      animation: dot-keys var(--animation);
    }

    .loader .circle .outline {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      animation: outline-keys var(--animation);
      box-sizing: content-box;
    }

    .circle:nth-child(2) { animation-delay: 0.3s; }
    .circle:nth-child(3) { animation-delay: 0.6s; }
    .circle:nth-child(4) { animation-delay: 0.9s; }
    .circle:nth-child(5) { animation-delay: 1.2s; }

    .circle:nth-child(2) .dot { animation-delay: 0.3s; }
    .circle:nth-child(3) .dot { animation-delay: 0.6s; }
    .circle:nth-child(4) .dot { animation-delay: 0.9s; }
    .circle:nth-child(5) .dot { animation-delay: 1.2s; }

    .circle:nth-child(1) .outline { animation-delay: 0.9s; }
    .circle:nth-child(2) .outline { animation-delay: 1.2s; }
    .circle:nth-child(3) .outline { animation-delay: 1.5s; }
    .circle:nth-child(4) .outline { animation-delay: 1.8s; }
    .circle:nth-child(5) .outline { animation-delay: 2.1s; }

    @keyframes circle-keys {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes dot-keys {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(0); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes outline-keys {
      0% { transform: translate(-50%, -50%) scale(0); outline: solid 20px var(--color); outline-offset: 0; opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); outline: solid 0 transparent; outline-offset: 20px; opacity: 0; }
    }

    /* ================================================================
       REDIRECTING ANIMATION (From Uiverse.io by Cebucoder)
    ================================================================= */
    .redirect-loader {
      width: 350px;
      max-width: 90vw;
      height: 180px;
      border-radius: 10px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 30px;
      box-shadow: 2px 2px 10px -5px lightgrey;
    }
    .redirect-loading {
      width: 100%;
      height: 10px;
      background: lightgrey;
      border-radius: 10px;
      position: relative;
    }
    .redirect-loading::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 10px;
      background: #002;
      border-radius: 10px;
      z-index: 1;
      animation: redirect-loading-anim 0.6s alternate infinite;
    }
    .redirect-loader label {
      color: #002;
      font-size: 18px;
      animation: redirect-bit-anim 0.6s alternate infinite;
    }

    @keyframes redirect-bit-anim {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    @keyframes redirect-loading-anim {
      0% { left: 25%; }
      100% { left: 50%; }
      0% { left: 0%; }
    }

    /* ================================================================
       MARQUEE BLUR HOVER EFFECT (Adapted from Uiverse.io by kamehame-ha)
    ================================================================= */
    .marquee-row {
      display: flex;
      gap: 12px;
    }

    .marquee-card {
      position: relative;
      height: 200px;
      width: 300px;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: 400ms ease;
      border: 1px solid #333;
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      .marquee-card {
        height: 270px;
        width: 420px;
      }
    }

    .marquee-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 400ms ease;
    }

    .marquee-card:hover {
      transform: scale(1.1);
      z-index: 10;
      border-color: #39bda7;
    }

    .marquee-card:hover img {
      transform: scale(1.1);
    }

    .marquee-row:hover > .marquee-card:not(:hover) {
      filter: blur(10px);
      transform: scale(0.9);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="typescript,react">
    import React, { useRef, useEffect, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { createPortal } from 'react-dom';
    import { motion, useScroll, useTransform, useSpring, AnimatePresence } from 'framer-motion';
    import { PlusIcon, MailIcon } from 'lucide-react';

    /* ================================================================
       1. LOADING SCREEN COMPONENT
    ================================================================= */
    const Loader = () => (
      <motion.div 
        initial={{ opacity: 1 }}
        exit={{ opacity: 0, scale: 1.05 }}
        transition={{ duration: 0.6, ease: [0.25, 0.1, 0.25, 1] }}
        className="fixed inset-0 z-[9999] flex items-center justify-center bg-[#0C0C0C]"
      >
        <div className="loader">
          <div className="circle"><div className="dot"></div><div className="outline"></div></div>
          <div className="circle"><div className="dot"></div><div className="outline"></div></div>
          <div className="circle"><div className="dot"></div><div className="outline"></div></div>
          <div className="circle"><div className="dot"></div><div className="outline"></div></div>
        </div>
      </motion.div>
    );

    /* ================================================================
       2. UI ADDONS (Cursor, Scroll Bar)
    ================================================================= */
    const CustomCursor = () => {
      const dotRef = useRef(null);
      const outlineRef = useRef(null);

      useEffect(() => {
        const mouseMove = (e) => {
          if (dotRef.current) {
            dotRef.current.style.left = `${e.clientX}px`;
            dotRef.current.style.top = `${e.clientY}px`;
          }
          if (outlineRef.current) {
            outlineRef.current.style.left = `${e.clientX}px`;
            outlineRef.current.style.top = `${e.clientY}px`;
          }
        };

        const mouseOver = (e) => {
          if (e.target.closest('a, button, .custom-contact-btn, .marquee-card')) {
            outlineRef.current?.classList.add('cursor-hover');
          } else {
            outlineRef.current?.classList.remove('cursor-hover');
          }
        };

        window.addEventListener('mousemove', mouseMove);
        document.addEventListener('mouseover', mouseOver);

        return () => {
          window.removeEventListener('mousemove', mouseMove);
          document.removeEventListener('mouseover', mouseOver);
        };
      }, []);

      return (
        <>
          <div ref={dotRef} className="cursor-dot hidden md:block"></div>
          <div ref={outlineRef} className="cursor-outline hidden md:block"></div>
        </>
      );
    };

    const ScrollProgress = () => {
      const { scrollYProgress } = useScroll();
      const scaleX = useSpring(scrollYProgress, { stiffness: 100, damping: 30, restDelta: 0.001 });
      return <motion.div style={{ scaleX }} className="fixed top-0 left-0 right-0 h-1 bg-[#39bda7] origin-left z-[9998]" />;
    };

    /* ================================================================
       3. REUSABLE COMPONENTS
    ================================================================= */

    const FadeIn = ({ 
      children, 
      delay = 0, 
      duration = 0.7, 
      x = 0, 
      y = 30, 
      className = '', 
      as = 'div', 
      style 
    }) => {
      const MotionTag = motion[as] || motion.div;

      return (
        <MotionTag
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: '50px', amount: 0 }}
          transition={{ delay, duration, ease: [0.25, 0.1, 0.25, 1] }}
          className={className}
          style={style}
        >
          {children}
        </MotionTag>
      );
    };

    const Magnet = ({ 
      children, 
      padding = 100, 
      strength = 2, 
      activeTransition = 'transform 0.3s ease-out', 
      inactiveTransition = 'transform 0.6s ease-in-out', 
      className = '' 
    }) => {
      const ref = useRef(null);
      const [transform, setTransform] = useState('translate3d(0, 0, 0)');
      const [isActive, setIsActive] = useState(false);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!ref.current) return;
          const rect = ref.current.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const distX = e.clientX - centerX;
          const distY = e.clientY - centerY;

          if (Math.abs(distX) < rect.width / 2 + padding && Math.abs(distY) < rect.height / 2 + padding) {
            setTransform(`translate3d(${distX / strength}px, ${distY / strength}px, 0)`);
            setIsActive(true);
          } else {
            setTransform('translate3d(0, 0, 0)');
            setIsActive(false);
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, [padding, strength]);

      return (
        <div 
          ref={ref} 
          style={{ transform, transition: isActive ? activeTransition : inactiveTransition, willChange: 'transform' }} 
          className={className}
        >
          {children}
        </div>
      );
    };

    // Bottom Contact Button (Uses the Uiverse style)
    const ContactButton = ({ className = '', onClick }) => (
      <button
        onClick={onClick}
        className={`custom-contact-btn ${className}`}
      >
        <span style={{ position: 'relative', zIndex: 2 }}>Contact Me</span>
      </button>
    );

    const LiveProjectButton = ({ href, className = '' }) => (
      <a href={href} target="_blank" rel="noopener noreferrer">
        <button className={`rounded-full border-2 border-[#D7E2EA] text-[#D7E2EA] font-medium uppercase tracking-widest px-8 py-3 sm:px-10 sm:py-3.5 text-sm sm:text-base hover:bg-[#D7E2EA]/10 transition-colors whitespace-nowrap ${className}`}>
          Live Project
        </button>
      </a>
    );

    const CharacterSpan = ({ char, progress, start, end }) => {
      const opacity = useTransform(progress, [start, end], [0.2, 1]);
      const displayChar = char === ' ' ? '\u00A0' : char;
      return (
        <span style={{ display: 'inline-block', position: 'relative' }}>
          <span style={{ opacity: 0 }}>{displayChar}</span>
          <motion.span style={{ opacity, position: 'absolute', left: 0, top: 0 }}>
            {displayChar}
          </motion.span>
        </span>
      );
    };

    const AnimatedText = ({ text, className = '', style }) => {
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({ target: ref, offset: ['start 0.8', 'end 0.2'] });
      const characters = text.split('');

      return (
        <p ref={ref} className={className} style={style}>
          {characters.map((char, i) => {
            const start = i / characters.length;
            const end = start + 1 / characters.length;
            return <CharacterSpan key={i} char={char} progress={scrollYProgress} start={start} end={end} />;
          })}
        </p>
      );
    };

    // ================================================================
    // CONTACT CARD (Adapted from Shadcn UI)
    // ================================================================
    const ContactInfo = ({ icon: Icon, label, value, className }) => {
      return (
        <div className={`flex items-center gap-3 py-3 ${className}`}>
          <div className="bg-[#1c1c1c] rounded-lg p-3 border border-[#333]">
            <Icon className="h-5 w-5 text-[#39bda7]" />
          </div>
          <div>
            <p className="font-medium text-[#D7E2EA]">{label}</p>
            <p className="text-[#D7E2EA]/60 text-xs">{value}</p>
          </div>
        </div>
      );
    };

    const ContactCard = ({ title, description, contactInfo, className, formSectionClassName, children }) => {
      return (
        <div
          className={`bg-[#0C0C0C] border border-[#333] relative grid h-full w-full shadow-xl md:grid-cols-2 rounded-2xl overflow-hidden ${className}`}
        >
          <PlusIcon className="absolute -top-3 -left-3 h-6 w-6 text-[#333] z-10" />
          <PlusIcon className="absolute -top-3 -right-3 h-6 w-6 text-[#333] z-10" />
          <PlusIcon className="absolute -bottom-3 -left-3 h-6 w-6 text-[#333] z-10" />
          <PlusIcon className="absolute -right-3 -bottom-3 h-6 w-6 text-[#333] z-10" />
          
          <div className="flex flex-col justify-between lg:col-span-1">
            <div className="relative h-full space-y-4 px-6 py-8 md:p-8">
              <h1 className="text-3xl font-bold md:text-4xl text-[#D7E2EA]">
                {title}
              </h1>
              <p className="text-[#D7E2EA]/60 max-w-xl text-sm md:text-base">
                {description}
              </p>
              <div className="grid gap-4 md:grid md:grid-cols-2 lg:grid-cols-1">
                {contactInfo?.map((info, index) => (
                  <ContactInfo key={index} {...info} />
                ))}
              </div>
            </div>
          </div>
          
          <div
            className={`bg-[#0c0c0c]/40 flex h-full w-full items-center border-t border-[#333] p-6 md:col-span-1 md:border-t-0 md:border-l ${formSectionClassName}`}
          >
            {children}
          </div>
        </div>
      );
    };

    // Contact Popup Modal with EmailJS Form
    const ContactModal = ({ isOpen, onClose }) => {
      const [status, setStatus] = useState('idle');
      const formRef = useRef(null);

      useEffect(() => {
        if (window.emailjs && !window.emailjs._initialized) {
          window.emailjs.init({ publicKey: "IW1i-nio_-5fYvSph" });
          window.emailjs._initialized = true;
        }
      }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        setStatus('sending');

        window.emailjs.sendForm('service_8ogpgr3', 'template_aqojt4o', formRef.current)
          .then((result) => {
            setStatus('success');
            formRef.current.reset();
            setTimeout(() => {
              setStatus('idle');
              onClose();
            }, 2500);
          }, (error) => {
            setStatus('error');
          });
      };

      return createPortal(
        <AnimatePresence>
          {isOpen && (
            <motion.div 
              initial={{ opacity: 0 }}
              animate={{ opacity: 1 }}
              exit={{ opacity: 0 }}
              className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4"
              onClick={onClose}
            >
              <motion.div 
                initial={{ scale: 0.8, opacity: 0, y: 20 }}
                animate={{ scale: 1, opacity: 1, y: 0 }}
                exit={{ scale: 0.8, opacity: 0, y: 20 }}
                transition={{ duration: 0.3, ease: [0.25, 0.1, 0.25, 1] }}
                className="max-w-4xl w-full"
                onClick={(e) => e.stopPropagation()}
              >
                <ContactCard
                  title="Let's Work Together"
                  description="Have a project in mind or need a consultation? Fill out the form, and I'll get back to you within 24 hours."
                  contactInfo={[
                    {
                      icon: MailIcon,
                      label: 'Email',
                      value: 'workwitharshman@gmail.com',
                    }
                  ]}
                >
                  {status === 'success' ? (
                    <div className="text-center py-10 w-full">
                      <div className="text-green-500 text-5xl mb-4">✓</div>
                      <p className="text-[#D7E2EA] text-xl font-medium">Message Sent!</p>
                      <p className="text-[#D7E2EA]/60 mt-2">I will get back to you shortly.</p>
                    </div>
                  ) : (
                    <form ref={formRef} onSubmit={handleSubmit} className="w-full space-y-4">
                      <div className="flex flex-col gap-2">
                        <label className="text-[#D7E2EA] text-sm font-medium">Name</label>
                        <input 
                          type="text" 
                          name="from_name" 
                          required 
                          placeholder="Your Name" 
                          className="bg-[#0C0C0C] border border-[#333] text-[#D7E2EA] rounded-md px-4 py-2.5 focus:outline-none focus:border-[#39bda7] transition-colors w-full text-sm"
                        />
                      </div>
                      <div className="flex flex-col gap-2">
                        <label className="text-[#D7E2EA] text-sm font-medium">Subject</label>

          const newOffset = (window.scrollY - sectionTop + window.innerHeight) * 0.3;
          setOffset(newOffset);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const row1Images = [...marqueeImages.slice(0, 11), ...marqueeImages.slice(0, 11), ...marqueeImages.slice(0, 11)];

    ================================================================= */
    const Footer = ({ onEmailClick, onGithubClick }) => (
      <footer className="bg-[#0C0C0C] pt-20 pb-10 px-6 md:px-10 border-t border-[#1c1c1c] relative z-10 w-full text-center">
        <FadeIn delay={0} y={30}>
          <h2 className="hero-heading text-3xl sm:text-4xl md:text-6xl font-black uppercase tracking-tight mb-8">
            Let's build something incredible together
          </h2>
          <div className="flex flex-col sm:flex-row gap-6 sm:gap-12 justify-center items-center mb-16">
            <button
              onClick={onGithubClick}
              className="text-[#D7E2EA] hover:text-[#39bda7] transition-colors uppercase tracking-widest text-sm font-medium bg-transparent border-none cursor-pointer"
            >
              GitHub
            </button>
            <button
              onClick={onEmailClick}
              className="text-[#D7E2EA] hover:text-[#39bda7] transition-colors uppercase tracking-widest text-sm font-medium bg-transparent border-none cursor-pointer"
            >
              Email
            </button>
          </div>
          <p className="text-[#D7E2EA]/40 text-xs uppercase tracking-widest">
            © {new Date().getFullYear()} Arshman Anil. All rights reserved.
          </p>
        </FadeIn>
      </footer>
    );

    /* ================================================================
       7. MAIN APP
    ================================================================= */

    const App = () => {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isEmailModalOpen, setIsEmailModalOpen] = useState(false);
      const [isRedirecting, setIsRedirecting] = useState(false);
      const [redirectUrl, setRedirectUrl] = useState("");
      const [isLoading, setIsLoading] = useState(true);

      // Handle Loading Screen Timer
      useEffect(() => {
        const timer = setTimeout(() => setIsLoading(false), 2500); // 2.5 seconds
        return () => clearTimeout(timer);
      }, []);

      // Handle initial load and scroll restoration
      useEffect(() => {
        window.history.scrollRestoration = 'manual';
        
        // Clean up any old hashes from previous versions
        if (window.location.hash) {
          window.history.replaceState(null, '', window.location.pathname);
        }
        
        window.scrollTo(0, 0);
      }, []);

      // Handle dynamic URL updating (Clean URLs instead of #)
      useEffect(() => {
        const sectionIds = ['home', 'about', 'projects'];
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const id = entry.target.getAttribute('id');
              const path = id === 'home' ? '/' : `/${id}`;
              
              // Update URL if it changed
              if (window.location.pathname !== path) {
                window.history.replaceState(null, '', path);
              }
            }
          });
        }, { rootMargin: '-50% 0px -50% 0px', threshold: 0 });

        sectionIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) observer.observe(el);
        });

        return () => observer.disconnect();
      }, []);

      // Handle manual Nav Clicks to smooth scroll
      const handleNavClick = (e, id) => {
        e.preventDefault();
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      // Handle GitHub Redirect
      const handleGithubRedirect = () => {
        setRedirectUrl('https://github.com/ZentrixVayne');
        setIsRedirecting(true);
      };

      return (
        <>
          <CustomCursor />
          <ScrollProgress />

          <AnimatePresence>
            {isLoading && <Loader />}
          </AnimatePresence>

          <div style={{ overflowX: 'clip', backgroundColor: '#0C0C0C', minHeight: '100vh', fontFamily: "'Kanit', sans-serif" }}>
            <HeroSection onContactClick={() => setIsModalOpen(true)} onNavClick={handleNavClick} />
            <MarqueeSection />
            <AboutSection onContactClick={() => setIsModalOpen(true)} />
            <ServicesSection />
            <ProjectsSection />
            <Footer onEmailClick={() => setIsEmailModalOpen(true)} onGithubClick={handleGithubRedirect} />
            
            {/* Render the Contact Form Modal via Portal */}
            <ContactModal 
              isOpen={isModalOpen} 
              onClose={() => setIsModalOpen(false)} 
            />

            {/* Render the Email Copy Modal via Portal */}
            <EmailCopyModal 
              isOpen={isEmailModalOpen} 
              onClose={() => setIsEmailModalOpen(false)} 
              email="workwitharshman@gmail.com"
            />

            {/* Render the Redirect Modal via Portal */}
            <RedirectModal 
              isOpen={isRedirecting} 
              url={redirectUrl} 
              onClose={() => setIsRedirecting(false)} 
            />
          </div>
        </>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
