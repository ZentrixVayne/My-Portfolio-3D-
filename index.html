  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
    }
    html, body, #root {
      background-color: #0C0C0C;
      font-family: 'Kanit', sans-serif;
      color: #D7E2EA;
      width: 100%;
      overflow-x: clip;
    }
    .hero-heading {
      background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .project-card-wrapper {
      position: sticky;
      top: calc(6rem + var(--card-offset, 0px));
    }
    @media (min-width: 768px) {
      .project-card-wrapper {
        top: calc(8rem + var(--card-offset, 0px));
      }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0c0c0c; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    /* ================================================================
       CUSTOM CONTACT BUTTON (From Uiverse.io)
    ================================================================= */
    .custom-contact-btn {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #4f4f4f;
      border-radius: 4px;
      transition: all 0.2s ease-in;
      position: relative;
      overflow: hidden;
      font-size: 19px;
      cursor: pointer;
      color: #D7E2EA;
      z-index: 1;
      background: transparent;
      font-family: 'Kanit', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      isolation: isolate;
    }

    .custom-contact-btn:before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%) scaleY(1) scaleX(1.25);
      top: 100%;
      width: 140%;
      height: 180%;
      background-color: rgba(0, 0, 0, 0.05);
      border-radius: 50%;
      display: block;
      transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
      z-index: -1;
    }

    .custom-contact-btn:after {
      content: "";
      position: absolute;
      left: 55%;
      transform: translateX(-50%) scaleY(1) scaleX(1.45);
      top: 180%;
      width: 160%;
      height: 190%;
      background-color: #39bda7;
      border-radius: 50%;
      display: block;
      transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
      z-index: -1;
    }

    .custom-contact-btn:hover {
      color: #ffffff;
      border: 1px solid #39bda7;
    }

    .custom-contact-btn:hover:before {
      top: -35%;
      background-color: #39bda7;
      transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
    }

    .custom-contact-btn:hover:after {
      top: -45%;
      background-color: #39bda7;
      transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
    }

    /* ================================================================
       LOADING SCREEN ANIMATION (From Uiverse.io by AatreyuShau)
    ================================================================= */
    .loader {
      scale: 0.75;
      position: relative;
      width: 200px;
      height: 200px;
      translate: 10px -20px;
    }
    .loader svg {
      position: absolute;
      top: 0;
      left: 0;
    }
    .head {
      translate: 27px -30px;
      z-index: 3;
      animation: bob 1s infinite ease-in;
    }
    .bod {
      translate: 0px 30px;
      z-index: 3;
      animation: bob 1s infinite ease-in-out;
    }
    .legr {
      translate: 75px 135px;
      z-index: 0;
      animation: rstep 1s infinite ease-in;
      animation-delay: 0.45s;
    }
    .legl {
      translate: 30px 155px;
      z-index: 3;
      animation: lstep 1s infinite ease-in;
    }

    @keyframes bob {
      0% { transform: translateY(0) rotate(3deg); }
      5% { transform: translateY(0) rotate(3deg); }
      25% { transform: translateY(5px) rotate(0deg); }
      50% { transform: translateY(0px) rotate(-3deg); }
      70% { transform: translateY(5px) rotate(0deg); }
      100% { transform: translateY(0) rotate(3deg); }
    }

    @keyframes lstep {
      0% { transform: translateY(0) rotate(-5deg); }
      33% { transform: translateY(-15px) translate(32px) rotate(35deg); }
      66% { transform: translateY(0) translate(25px) rotate(-25deg); }
      100% { transform: translateY(0) rotate(-5deg); }
    }

    @keyframes rstep {
      0% { transform: translateY(0) translate(0px) rotate(-5deg); }
      33% { transform: translateY(-10px) translate(30px) rotate(35deg); }
      66% { transform: translateY(0) translate(20px) rotate(-25deg); }
      100% { transform: translateY(0) translate(0px) rotate(-5deg); }
    }

    #gnd {
      translate: -140px 0;
      rotate: 10deg;
      z-index: -1;
      filter: blur(0.5px) drop-shadow(1px 3px 5px #000000);
      opacity: 0.25;
      animation: scroll 5s infinite linear;
    }

    @keyframes scroll {
      0% { transform: translateY(25px) translate(50px); opacity: 0; }
      33% { opacity: 0.25; }
      66% { opacity: 0.25; }
      to { transform: translateY(-50px) translate(-100px); opacity: 0; }
    }
  </style>
</head>

      return (
        <MotionTag
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: '50px', amount: 0 }}
          transition={{ delay, duration, ease: [0.25, 0.1, 0.25, 1] }}
          className={className}
          style={style}
        >
          {children}
        </MotionTag>
      );

    const Magnet = ({ 
      children, 
      padding = 100, 
      strength = 2, 
      activeTransition = 'transform 0.3s ease-out', 
      inactiveTransition = 'transform 0.6s ease-in-out', 
      className = '' 
    }) => {
      const ref = useRef(null);
      const [transform, setTransform] = useState('translate3d(0, 0, 0)');
      const [isActive, setIsActive] = useState(false);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!ref.current) return;
          const rect = ref.current.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const distX = e.clientX - centerX;
          const distY = e.clientY - centerY;

          if (Math.abs(distX) < rect.width / 2 + padding && Math.abs(distY) < rect.height / 2 + padding) {
            setTransform(`translate3d(${distX / strength}px, ${distY / strength}px, 0)`);
            setIsActive(true);
          } else {
            setTransform('translate3d(0, 0, 0)');
            setIsActive(false);
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, [padding, strength]);

      return (
        <div 
          ref={ref} 
          style={{ transform, transition: isActive ? activeTransition : inactiveTransition, willChange: 'transform' }} 
          className={className}
        >
          {children}
        </div>

    const ServicesSection = () => {
      return (
        <section className="bg-white rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32 relative z-10 w-full">
          <FadeIn delay={0} y={40}>
            <h2 className="text-[#0C0C0C] font-black uppercase text-center leading-none tracking-tight" style={{ fontSize: 'clamp(2.5rem, 12vw, 160px)' }}>
              Services
            </h2>
          </FadeIn>
          <div className="max-w-5xl mx-auto mt-10 sm:mt-16 md:mt-20">
            {services.map((service, i) => (
              <FadeIn key={i} delay={i * 0.1} y={30}>
                <div className="flex items-start gap-4 sm:gap-8 md:gap-10 py-8 sm:py-10 md:py-12" style={{ borderTop: i > 0 ? '1px solid rgba(12, 12, 12, 0.15)' : 'none' }}>
                  <span className="font-black text-[#0C0C0C] leading-none flex-shrink-0" style={{ fontSize: 'clamp(2.5rem, 10vw, 140px)' }}>
                    {service.number}
                  </span>
                  <div className="flex flex-col gap-2 sm:gap-3 pt-2 sm:pt-4">
                    <h3 className="font-medium uppercase text-[#0C0C0C] leading-tight" style={{ fontSize: 'clamp(1rem, 2.2vw, 2.1rem)' }}>
                      {service.name}
                    </h3>
                    <p className="font-light leading-relaxed max-w-2xl text-[#0C0C0C]" style={{ fontSize: 'clamp(0.85rem, 1.6vw, 1.25rem)', opacity: 0.6 }}>
                      {service.description}
                    </p>
                  </div>
                </div>
              </FadeIn>
            ))}
          </div>
        </section>
      );
    };

    const ProjectCard = ({ project, index, total }) => {
      const ref = useRef(null);
      const targetScale = 1 - (total - 1 - index) * 0.03;
      const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end start'] });
      const scale = useTransform(scrollYProgress, [0, 1], [1, targetScale]);

      return (
        <div ref={ref} className="h-[85vh] project-card-wrapper flex justify-center" style={{ '--card-offset': `${index * 28}px` }}>
          <motion.div style={{ scale }} className="w-full h-full rounded-[30px] sm:rounded-[40px] md:rounded-[60px] border-2 border-[#D7E2EA] bg-[#0C0C0C] p-4 sm:p-6 md:p-8 flex flex-col overflow-hidden">
            <div className="flex items-start justify-between gap-2 sm:gap-4 mb-4 sm:mb-6 md:mb-8">
              <div className="flex items-start gap-3 sm:gap-6 md:gap-8 flex-1 min-w-0">
                <span className="hero-heading font-black leading-none flex-shrink-0" style={{ fontSize: 'clamp(2.5rem, 8vw, 140px)' }}>
                  {project.number}
                </span>
                <div className="flex flex-col gap-1 pt-1 sm:pt-4 md:pt-6 min-w-0">
                  <span className="text-[#D7E2EA]/60 font-medium uppercase tracking-widest text-[10px] sm:text-sm md:text-base">
                    {project.category}
                  </span>
                  <h3 className="text-[#D7E2EA] font-medium uppercase leading-tight" style={{ fontSize: 'clamp(0.9rem, 2vw, 2.1rem)' }}>
                    {project.name}
                  </h3>
                </div>
              </div>
              <LiveProjectButton href={project.link} className="flex-shrink-0 !text-[10px] !px-4 !py-2 sm:!text-sm sm:!px-8 sm:!py-3 md:!px-10 md:!py-3.5 md:!text-base" />
            </div>
            <div className="flex gap-3 sm:gap-4 md:gap-6 flex-1 min-h-0">
              <div className="flex flex-col gap-3 sm:gap-4 md:gap-6 w-[40%]">
                <img src={project.images.col1img1} alt="" className="w-full rounded-[16px] sm:rounded-[32px] md:rounded-[40px] object-cover flex-shrink-0" style={{ height: 'clamp(130px, 16vw, 230px)' }} loading="lazy" />
                <img src={project.images.col1img2} alt="" className="w-full rounded-[16px] sm:rounded-[32px] md:rounded-[40px] object-cover flex-1 min-h-0" style={{ minHeight: 'clamp(160px, 22vw, 340px)' }} loading="lazy" />
              </div>
              <div className="w-[60%]">
                <img src={project.images.col2img} alt="" className="w-full h-full rounded-[16px] sm:rounded-[32px] md:rounded-[40px] object-cover" loading="lazy" />
              </div>
            </div>
          </motion.div>
        </div>
      );
    };

    const ProjectsSection = () => {
      return (
        <section id="projects" className="bg-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 z-10 relative w-full">
          <div className="px-5 sm:px-8 md:px-10 pt-20 sm:pt-24 md:pt-32 pb-40 sm:pb-48 md:pb-56">
            <FadeIn delay={0} y={40}>
              <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-center" style={{ fontSize: 'clamp(2.5rem, 12vw, 160px)' }}>
                Project
              </h2>
            </FadeIn>
            <div className="mt-16 sm:mt-20 md:mt-28 max-w-6xl mx-auto">
              {projects.map((project, index) => (
                <ProjectCard key={index} project={project} index={index} total={projects.length} />
              ))}
            </div>
          </div>
        </section>
      );
    };

    /* ================================================================
       5. MAIN APP
    ================================================================= */

    const App = () => {
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isLoading, setIsLoading] = useState(true);

      // Handle Loading Screen Timer
      useEffect(() => {
        const timer = setTimeout(() => setIsLoading(false), 2500); // 2.5 seconds
        return () => clearTimeout(timer);
      }, []);

      // Handle initial load and scroll restoration
      useEffect(() => {
        window.history.scrollRestoration = 'manual';
        
        // Clean up any old hashes from previous versions
        if (window.location.hash) {
          window.history.replaceState(null, '', window.location.pathname);
        }
        
        window.scrollTo(0, 0);
      }, []);

      // Handle dynamic URL updating (Clean URLs instead of #)
      useEffect(() => {
        const sectionIds = ['home', 'about', 'projects'];
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const id = entry.target.getAttribute('id');
              const path = id === 'home' ? '/' : `/${id}`;
              
              // Update URL if it changed
              if (window.location.pathname !== path) {
                window.history.replaceState(null, '', path);
              }
            }
          });
        }, { rootMargin: '-50% 0px -50% 0px', threshold: 0 });

        sectionIds.forEach(id => {
          const el = document.getElementById(id);
          if (el) observer.observe(el);
        });

        return () => observer.disconnect();
      }, []);

      // Handle manual Nav Clicks to smooth scroll
      const handleNavClick = (e, id) => {
        e.preventDefault();
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      return (
        <>
          <AnimatePresence>
            {isLoading && <Loader />}
          </AnimatePresence>

          <div style={{ overflowX: 'clip', backgroundColor: '#0C0C0C', minHeight: '100vh', fontFamily: "'Kanit', sans-serif" }}>
            <HeroSection onContactClick={() => setIsModalOpen(true)} onNavClick={handleNavClick} />
            <MarqueeSection />
            <AboutSection onContactClick={() => setIsModalOpen(true)} />
            <ServicesSection />
            <ProjectsSection />
            
            {/* Render the Contact Popup Modal via Portal */}
            <ContactModal 
              isOpen={isModalOpen} 
              onClose={() => setIsModalOpen(false)} 
            />
          </div>
        </>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
