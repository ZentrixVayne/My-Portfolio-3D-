<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arshman -- 3D Creator</title>

  <!-- Google Fonts (Kanit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Suppress Tailwind & Babel CDN console warnings for clean console
    window.console.warn = (() => {
      const orig = window.console.warn;
      return (...args) => {
        if (typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        if (typeof args[0] === 'string' && args[0].includes('in-browser Babel transformer')) return;
        orig(...args);
      };
    })();
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kanit: ['Kanit', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Babel to compile TSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React 18 & Framer Motion via ES Modules (importmap) -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom"
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      background-color: #0C0C0C;
      font-family: 'Kanit', sans-serif;
      color: #D7E2EA;
      width: 100%;
      overflow-x: clip;
    }
    .hero-heading {
      background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .project-card-wrapper {
      position: sticky;
      top: calc(6rem + var(--card-offset, 0px));
    }
    @media (min-width: 768px) {
      .project-card-wrapper {
        top: calc(8rem + var(--card-offset, 0px));
      }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0c0c0c; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }
  </style>
</head>
<body>
  <div id="root">
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; color: #D7E2EA; font-family: sans-serif;">
      Loading Arshman's Portfolio...
    </div>
  </div>

  <script type="text/babel" data-type="module" data-presets="typescript,react">
    import React, { useRef, useEffect, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, useScroll, useTransform } from 'framer-motion';

    /* ================================================================
       1. REUSABLE COMPONENTS
    ================================================================= */

    const FadeIn = ({ 
      children, 
      delay = 0, 
      duration = 0.7, 
      x = 0, 
      y = 30, 
      className = '', 
      as = 'div', 
      style 
    }) => {
      const MotionTag = motion[as] || motion.div;

      return (
        <MotionTag
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: '50px', amount: 0 }}
          transition={{ delay, duration, ease: [0.25, 0.1, 0.25, 1] }}
          className={className}
          style={style}
        >
          {children}
        </MotionTag>
      );
    };

    const Magnet = ({ 
      children, 
      padding = 100, 
      strength = 2, 
      activeTransition = 'transform 0.3s ease-out', 
      inactiveTransition = 'transform 0.6s ease-in-out', 
      className = '' 
    }) => {
      const ref = useRef(null);
      const [transform, setTransform] = useState('translate3d(0, 0, 0)');
      const [isActive, setIsActive] = useState(false);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!ref.current) return;
          const rect = ref.current.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const distX = e.clientX - centerX;
          const distY = e.clientY - centerY;

          if (Math.abs(distX) < rect.width / 2 + padding && Math.abs(distY) < rect.height / 2 + padding) {
            setTransform(`translate3d(${distX / strength}px, ${distY / strength}px, 0)`);
            setIsActive(true);
          } else {
            setTransform('translate3d(0, 0, 0)');
            setIsActive(false);
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, [padding, strength]);

      return (
        <div 
          ref={ref} 
          style={{ transform, transition: isActive ? activeTransition : inactiveTransition, willChange: 'transform' }} 
          className={className}
        >
          {children}
        </div>
      );
    };

    const ContactButton = ({ className = '' }) => (
      <button
        className={`rounded-full font-medium uppercase tracking-widest text-white px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-xs sm:text-sm md:text-base transition-transform hover:scale-105 ${className}`}
        style={{
          background: 'linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%)',
          boxShadow: '0px 4px 4px rgba(181, 1, 167, 0.25), 4px 4px 12px #7721B1 inset',
          outline: '2px solid white',
          outlineOffset: '-3px',
          border: 'none',
          cursor: 'pointer',
        }}
      >
        Contact Me
      </button>
    );

    const LiveProjectButton = ({ className = '' }) => (
      <button className={`rounded-full border-2 border-[#D7E2EA] text-[#D7E2EA] font-medium uppercase tracking-widest px-8 py-3 sm:px-10 sm:py-3.5 text-sm sm:text-base hover:bg-[#D7E2EA]/10 transition-colors whitespace-nowrap ${className}`}>
        Live Project
      </button>
    );

    const CharacterSpan = ({ char, progress, start, end }) => {
      const opacity = useTransform(progress, [start, end], [0.2, 1]);
      const displayChar = char === ' ' ? '\u00A0' : char;
      return (
        <span style={{ display: 'inline-block', position: 'relative' }}>
          <span style={{ opacity: 0 }}>{displayChar}</span>
          <motion.span style={{ opacity, position: 'absolute', left: 0, top: 0 }}>
            {displayChar}
          </motion.span>
        </span>
      );
    };

    const AnimatedText = ({ text, className = '', style }) => {
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({ target: ref, offset: ['start 0.8', 'end 0.2'] });
      const characters = text.split('');

      return (
        <p ref={ref} className={className} style={style}>
          {characters.map((char, i) => {
            const start = i / characters.length;
            const end = start + 1 / characters.length;
            return <CharacterSpan key={i} char={char} progress={scrollYProgress} start={start} end={end} />;
          })}
        </p>
      );
    };

    /* ================================================================
       2. DATA
    ================================================================= */

    const marqueeImages = [
      'https://motionsites.ai/assets/hero-space-voyage-preview-eECLH3Yc.gif', 'https://motionsites.ai/assets/hero-codenest-preview-Cgppc2qV.gif', 'https://motionsites.ai/assets/hero-vex-ventures-preview-BczMFIiw.gif', 'https://motionsites.ai/assets/hero-stellar-ai-v2-preview-DjvxjG3C.gif', 'https://motionsites.ai/assets/hero-asme-preview-B_nGDnTP.gif', 'https://motionsites.ai/assets/hero-transform-data-preview-Cx5OU29N.gif', 'https://motionsites.ai/assets/hero-vitara-preview-Cjz2QYyU.gif', 'https://motionsites.ai/assets/hero-terra-preview-BFjrCr7T.gif', 'https://motionsites.ai/assets/hero-skyelite-preview-DHaZIgUv.gif', 'https://motionsites.ai/assets/hero-aethera-preview-DknSlcTa.gif', 'https://motionsites.ai/assets/hero-designpro-preview-D8c5_een.gif', 'https://motionsites.ai/assets/hero-stellar-ai-preview-D3HL6bw1.gif', 'https://motionsites.ai/assets/hero-xportfolio-preview-D4A8maiC.gif', 'https://motionsites.ai/assets/hero-orbit-web3-preview-BXt4OttD.gif', 'https://motionsites.ai/assets/hero-nexora-preview-cx5HmUgo.gif', 'https://motionsites.ai/assets/hero-evr-ventures-preview-DZxeVFEX.gif', 'https://motionsites.ai/assets/hero-planet-orbit-preview-DWAP8Z1P.gif', 'https://motionsites.ai/assets/hero-new-era-preview-CocuDUm9.gif', 'https://motionsites.ai/assets/hero-wealth-preview-B70idl_u.gif', 'https://motionsites.ai/assets/hero-luminex-preview-CxOP7ce6.gif', 'https://motionsites.ai/assets/hero-celestia-preview-0yO3jXO8.gif',
    ];

    const services = [
      { number: '01', name: '3D Modeling', description: 'Creation of detailed objects, characters, or environments tailored to specific client needs, ideal for games, products, and visualizations.' },
      { number: '02', name: 'Rendering', description: 'High-quality, photorealistic renders that showcase designs with custom lighting, textures, and materials to bring concepts to life.' },
      { number: '03', name: 'Motion Design', description: 'Dynamic animations and motion graphics that add energy and storytelling to brands, products, and digital experiences.' },
      { number: '04', name: 'Branding', description: 'Crafting cohesive visual identities — from logos to full brand systems — that communicate a clear and memorable presence.' },
      { number: '05', name: 'Web Design', description: 'Designing clean, modern, and conversion-focused websites with attention to layout, typography, and user experience.' },
    ];

    const projects = [
      {
        number: '01', category: 'Client', name: 'Nextlevel Studio',
        images: {
          col1img1: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055344_5eff02e0-87a5-41ce-b64f-eb08da8f33db.png&w=1280&q=85',
          col1img2: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055431_11d841fd-8b41-46a5-82e4-b04f2407a7d8.png&w=1280&q=85',
          col2img: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055451_e317bf2d-28d4-48cc-86b0-6f72f25b6327.png&w=1280&q=85',
        },
      },
      {
        number: '02', category: 'Personal', name: 'Aura Brand Identity',
        images: {
          col1img1: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055654_911201c5-36d9-4bc6-bac7-331adfce159f.png&w=1280&q=85',
          col1img2: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055723_5ceda0b8-d9c2-4665-b2e3-83ba19ba76d1.png&w=1280&q=85',
          col2img: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055753_adc5dcbd-a8e6-49c0-b43a-9b030d835cea.png&w=1280&q=85',
        },
      },
      {
        number: '03', category: 'Client', name: 'Solaris Digital',
        images: {
          col1img1: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055759_963cfb0b-4bd1-4b0f-9d0a-09bd6cf95b2f.png&w=1280&q=85',
          col1img2: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_060108_438f781a-9846-4dcc-89ab-c4e6cb830f5b.png&w=1280&q=85',
          col2img: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260412_055818_9d062121-ad7e-46b9-999a-1a6a692ef1ee.png&w=1280&q=85',
        },
      },
    ];

    /* ================================================================
       3. SECTIONS
    ================================================================= */

    const HeroSection = () => {
      const navLinks = ['About', 'Price', 'Projects', 'Contact'];
      return (
        <section className="h-screen flex flex-col relative w-full" style={{ overflowX: 'clip' }}>
          {/* Navbar */}
          <FadeIn as="nav" delay={0} y={-20} className="flex justify-between items-center px-6 md:px-10 pt-6 md:pt-8 w-full">
            {navLinks.map((link, i) => (
              <a key={i} href={`#${link.toLowerCase()}`} className="text-[#D7E2EA] font-medium uppercase tracking-wider text-xs sm:text-sm md:text-lg lg:text-[1.4rem] hover:opacity-70 transition-opacity duration-200">
                {link}
              </a>
            ))}
          </FadeIn>

          {/* Hero Heading */}
          <div className="w-full px-6 md:px-10 mt-auto mb-auto z-0">
            <FadeIn delay={0.15} y={40} className="w-full">
              <h1 
                className="hero-heading font-black uppercase tracking-tight leading-[1.1] text-center"
                style={{ fontSize: 'clamp(3rem, 14vw, 220px)' }}
              >
                <span className="block">Hi, i&apos;m</span>
                <span className="block">arshman</span>
              </h1>
            </FadeIn>
          </div>

          {/* Hero Portrait */}
          <div className="absolute left-1/2 -translate-x-1/2 z-10 top-1/2 -translate-y-1/2 sm:top-auto sm:translate-y-0 sm:bottom-0 w-full flex justify-center pointer-events-none">
            <FadeIn delay={0.6} y={30} className="pointer-events-auto">
              <Magnet padding={150} strength={3} activeTransition="transform 0.3s ease-out" inactiveTransition="transform 0.6s ease-in-out">
                <img 
                  src="./logo.png" 
                  alt="Arshman" 
                  className="w-[60vw] max-w-[280px] sm:w-[50vw] sm:max-w-[360px] md:w-[440px] lg:w-[520px] object-contain" 
                />
              </Magnet>
            </FadeIn>
          </div>

          {/* Bottom Bar */}
          <div className="flex justify-between items-end pb-7 sm:pb-8 md:pb-10 px-6 md:px-10 relative z-20 gap-4">
            <FadeIn delay={0.35} y={20} className="flex-1">
              <p className="text-[#D7E2EA] font-light uppercase tracking-wide leading-snug max-w-[160px] sm:max-w-[220px] md:max-w-[260px]" style={{ fontSize: 'clamp(0.75rem, 1.4vw, 1.5rem)' }}>
                a 3d creator driven by crafting striking and unforgettable projects
              </p>
            </FadeIn>
            <FadeIn delay={0.5} y={20}>
              <ContactButton />
            </FadeIn>
          </div>
        </section>
      );
    };

    const MarqueeSection = () => {
      const sectionRef = useRef(null);
      const [offset, setOffset] = useState(0);

      useEffect(() => {
        const handleScroll = () => {
          if (!sectionRef.current) return;
          const sectionTop = sectionRef.current.offsetTop;
          const newOffset = (window.scrollY - sectionTop + window.innerHeight) * 0.3;
          setOffset(newOffset);
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const row1Images = [...marqueeImages.slice(0, 11), ...marqueeImages.slice(0, 11), ...marqueeImages.slice(0, 11)];
      const row2Images = [...marqueeImages.slice(11), ...marqueeImages.slice(11), ...marqueeImages.slice(11)];

      return (
        <section ref={sectionRef} className="bg-[#0C0C0C] pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden">
          <div className="flex flex-col gap-3">
            <div className="flex gap-3" style={{ transform: `translateX(${offset - 200}px)`, willChange: 'transform' }}>
              {row1Images.map((src, i) => (
                <img key={`r1-${i}`} src={src} className="w-[300px] h-[200px] sm:w-[420px] sm:h-[270px] rounded-2xl object-cover flex-shrink-0" loading="lazy" alt="" />
              ))}
            </div>
            <div className="flex gap-3" style={{ transform: `translateX(${-(offset - 200)}px)`, willChange: 'transform' }}>
              {row2Images.map((src, i) => (
                <img key={`r2-${i}`} src={src} className="w-[300px] h-[200px] sm:w-[420px] sm:h-[270px] rounded-2xl object-cover flex-shrink-0" loading="lazy" alt="" />
              ))}
            </div>
          </div>
        </section>
      );
    };

    const AboutSection = () => {
      const aboutText = "With more than five years of experience in design, i focus on branding, web design, and user experience, i truly enjoy working with businesses that aim to stand out and present their best image. Let's build something incredible together!";
      return (
        <section className="min-h-screen flex flex-col items-center justify-center relative px-5 sm:px-8 md:px-10 py-20 w-full" style={{ overflowX: 'clip' }}>
          <FadeIn delay={0.1} x={-80} y={0} duration={0.9} className="absolute top-[4%] left-[1%] sm:left-[2%] md:left-[4%] z-0 pointer-events-none">
            <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png" alt="" className="w-[80px] sm:w-[160px] md:w-[210px]" />
          </FadeIn>
          <FadeIn delay={0.25} x={-80} y={0} duration={0.9} className="absolute bottom-[8%] left-[3%] sm:left-[6%] md:left-[10%] z-0 pointer-events-none">
            <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png" alt="" className="w-[70px] sm:w-[140px] md:w-[180px]" />
          </FadeIn>
          <FadeIn delay={0.15} x={80} y={0} duration={0.9} className="absolute top-[4%] right-[1%] sm:right-[2%] md:right-[4%] z-0 pointer-events-none">
            <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png" alt="" className="w-[80px] sm:w-[160px] md:w-[210px]" />
          </FadeIn>
          <FadeIn delay={0.3} x={80} y={0} duration={0.9} className="absolute bottom-[8%] right-[3%] sm:right-[6%] md:right-[10%] z-0 pointer-events-none">
            <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png" alt="" className="w-[90px] sm:w-[170px] md:w-[220px]" />
          </FadeIn>

          <div className="flex flex-col items-center gap-10 sm:gap-14 md:gap-16 relative z-10 w-full max-w-4xl">
            <FadeIn delay={0} y={40} className="w-full">
              <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-center" style={{ fontSize: 'clamp(2.5rem, 12vw, 160px)' }}>
                About me
              </h2>
            </FadeIn>
            <AnimatedText text={aboutText} className="text-[#D7E2EA] font-medium text-center leading-relaxed max-w-[560px]" style={{ fontSize: 'clamp(1rem, 2vw, 1.35rem)' }} />
          </div>

          <div className="mt-16 sm:mt-20 md:mt-24 relative z-10">
            <FadeIn delay={0.2} y={30}>
              <ContactButton />
            </FadeIn>
          </div>
        </section>
      );
    };

    const ServicesSection = () => {
      return (
        <section className="bg-white rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32 relative z-10 w-full">
          <FadeIn delay={0} y={40}>
            <h2 className="text-[#0C0C0C] font-black uppercase text-center leading-none tracking-tight" style={{ fontSize: 'clamp(2.5rem, 12vw, 160px)' }}>
              Services
            </h2>
          </FadeIn>
          <div className="max-w-5xl mx-auto mt-10 sm:mt-16 md:mt-20">
            {services.map((service, i) => (
              <FadeIn key={i} delay={i * 0.1} y={30}>
                <div className="flex items-start gap-4 sm:gap-8 md:gap-10 py-8 sm:py-10 md:py-12" style={{ borderTop: i > 0 ? '1px solid rgba(12, 12, 12, 0.15)' : 'none' }}>
                  <span className="font-black text-[#0C0C0C] leading-none flex-shrink-0" style={{ fontSize: 'clamp(2.5rem, 10vw, 140px)' }}>
                    {service.number}
                  </span>
                  <div className="flex flex-col gap-2 sm:gap-3 pt-2 sm:pt-4">
                    <h3 className="font-medium uppercase text-[#0C0C0C] leading-tight" style={{ fontSize: 'clamp(1rem, 2.2vw, 2.1rem)' }}>
                      {service.name}
                    </h3>
                    <p className="font-light leading-relaxed max-w-2xl text-[#0C0C0C]" style={{ fontSize: 'clamp(0.85rem, 1.6vw, 1.25rem)', opacity: 0.6 }}>
                      {service.description}
                    </p>
                  </div>
                </div>
              </FadeIn>
            ))}
          </div>
        </section>
      );
    };

    const ProjectCard = ({ project, index, total }) => {
      const ref = useRef(null);
      const targetScale = 1 - (total - 1 - index) * 0.03;
      const { scrollYProgress } = useScroll({ target: ref, offset: ['start start', 'end start'] });
      const scale = useTransform(scrollYProgress, [0, 1], [1, targetScale]);

      return (
        <div ref={ref} className="h-[85vh] project-card-wrapper flex justify-center" style={{ '--card-offset': `${index * 28}px` }}>
          <motion.div style={{ scale }} className="w-full h-full rounded-[30px] sm:rounded-[40px] md:rounded-[60px] border-2 border-[#D7E2EA] bg-[#0C0C0C] p-4 sm:p-6 md:p-8 flex flex-col overflow-hidden">
            <div className="flex items-start justify-between gap-2 sm:gap-4 mb-4 sm:mb-6 md:mb-8">
              <div className="flex items-start gap-3 sm:gap-6 md:gap-8 flex-1 min-w-0">
                <span className="hero-heading font-black leading-none flex-shrink-0" style={{ fontSize: 'clamp(2.5rem, 8vw, 140px)' }}>
                  {project.number}
                </span>
                <div className="flex flex-col gap-1 pt-1 sm:pt-4 md:pt-6 min-w-0">
                  <span className="text-[#D7E2EA]/60 font-medium uppercase tracking-widest text-[10px] sm:text-sm md:text-base">
                    {project.category}
                  </span>
                  <h3 className="text-[#D7E2EA] font-medium uppercase leading-tight" style={{ fontSize: 'clamp(0.9rem, 2vw, 2.1rem)' }}>
                    {project.name}
                  </h3>
                </div>
              </div>
              <LiveProjectButton className="flex-shrink-0 !text-[10px] !px-4 !py-2 sm:!text-sm sm:!px-8 sm:!py-3 md:!px-10 md:!py-3.5 md:!text-base" />
            </div>
            <div className="flex gap-3 sm:gap-4 md:gap-6 flex-1 min-h-0">
              <div className="flex flex-col gap-3 sm:gap-4 md:gap-6 w-[40%]">
                <img src={project.images.col1img1} alt="" className="w-full rounded-[16px] sm:rounded-[32px] md:rounded-[40px] object-cover flex-shrink-0" style={{ height: 'clamp(130px, 16vw, 230px)' }} loading="lazy" />
                <img src={project.images.col1img2} alt="" className="w-full rounded-[16px] sm:rounded-[32px] md:rounded-[40px] object-cover flex-1 min-h-0" style={{ minHeight: 'clamp(160px, 22vw, 340px)' }} loading="lazy" />
              </div>
              <div className="w-[60%]">
                <img src={project.images.col2img} alt="" className="w-full h-full rounded-[16px] sm:rounded-[32px] md:rounded-[40px] object-cover" loading="lazy" />
              </div>
            </div>
          </motion.div>
        </div>
      );
    };

    const ProjectsSection = () => {
      return (
        <section className="bg-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 z-10 relative w-full">
          <div className="px-5 sm:px-8 md:px-10 pt-20 sm:pt-24 md:pt-32 pb-40 sm:pb-48 md:pb-56">
            <FadeIn delay={0} y={40}>
              <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-center" style={{ fontSize: 'clamp(2.5rem, 12vw, 160px)' }}>
                Project
              </h2>
            </FadeIn>
            <div className="mt-16 sm:mt-20 md:mt-28 max-w-6xl mx-auto">
              {projects.map((project, index) => (
                <ProjectCard key={index} project={project} index={index} total={projects.length} />
              ))}
            </div>
          </div>
        </section>
      );
    };

    /* ================================================================
       4. MAIN APP
    ================================================================= */

    const App = () => {
      return (
        <div style={{ overflowX: 'clip', backgroundColor: '#0C0C0C', minHeight: '100vh', fontFamily: "'Kanit', sans-serif" }}>
          <HeroSection />
          <MarqueeSection />
          <AboutSection />
          <ServicesSection />
          <ProjectsSection />
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
