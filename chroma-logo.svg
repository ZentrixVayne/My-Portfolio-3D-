<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f4f0"/>
      <stop offset="1" stop-color="#e8e6df"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 5 color swatches -->
  <g transform="translate(600, 280)">
    <!-- Swatch 1 -->
    <rect x="-260" y="-80" width="90" height="160" rx="12" fill="url(#c1)"/>
    <!-- Swatch 2 -->
    <rect x="-155" y="-80" width="90" height="160" rx="12" fill="url(#c2)"/>
    <!-- Swatch 3 (center, taller) -->
    <rect x="-50" y="-95" width="100" height="190" rx="12" fill="url(#c3)"/>
    <!-- Swatch 4 -->
    <rect x="65" y="-80" width="90" height="160" rx="12" fill="url(#c4)"/>
    <!-- Swatch 5 -->
    <rect x="170" y="-80" width="90" height="160" rx="12" fill="url(#c5)"/>
    <!-- Small dots under each swatch -->
    <circle cx="-215" cy="100" r="4" fill="#0a0a0a" opacity="0.2"/>
    <circle cx="-110" cy="100" r="4" fill="#0a0a0a" opacity="0.2"/>
    <circle cx="0" cy="115" r="5" fill="#0a0a0a" opacity="0.3"/>
    <circle cx="110" cy="100" r="4" fill="#0a0a0a" opacity="0.2"/>
    <circle cx="215" cy="100" r="4" fill="#0a0a0a" opacity="0.2"/>
  </g>
  <!-- Chroma text -->
  <text x="600" y="520" font-family="Inter,sans-serif" font-size="72" font-weight="700" fill="#0a0a0a" text-anchor="middle" letter-spacing="-2">Chroma</text>
  <text x="600" y="565" font-family="sans-serif" font-size="16" letter-spacing="6" fill="#6b6b6b" text-anchor="middle" opacity="0.7">COLOR PALETTE GENERATOR</text>
</svg>
