<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#d4a564" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d4a564" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c896"/>
      <stop offset="1" stop-color="#c89860"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Shield with lock -->
  <g transform="translate(600, 280)">
    <!-- Shield outline -->
    <path d="M0,-140 L120,-100 L120,40 Q120,120 0,160 Q-120,120 -120,40 L-120,-100 Z" fill="none" stroke="url(#amber)" stroke-width="3" opacity="0.4"/>
    <!-- Lock body -->
    <rect x="-50" y="-10" width="100" height="80" rx="10" fill="url(#amber)" opacity="0.95"/>
    <!-- Lock shackle -->
    <path d="M-30,-10 L-30,-40 Q-30,-65 0,-65 Q30,-65 30,-40 L30,-10" fill="none" stroke="url(#amber)" stroke-width="8"/>
    <!-- Keyhole -->
    <circle cx="0" cy="25" r="8" fill="#0a0a0a"/>
    <rect x="-3" y="25" width="6" height="20" fill="#0a0a0a"/>
  </g>
  <!-- Keyforge text -->
  <text x="600" y="520" font-family="Georgia,serif" font-size="72" font-weight="400" fill="#fafafa" text-anchor="middle" letter-spacing="2">Keyforge</text>
  <text x="600" y="565" font-family="sans-serif" font-size="18" letter-spacing="6" fill="#8a8a8a" text-anchor="middle" opacity="0.7">PASSWORD FORGE</text>
</svg>
